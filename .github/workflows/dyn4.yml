name: DYN4 context reacquisition

on:
  push:
    paths:
      - 'experiments/dyn4_context_reacquisition.py'
      - '.github/workflows/dyn4.yml'
  workflow_dispatch:

jobs:
  dyn4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN4 context-state reacquisition gate
        run: python experiments/dyn4_context_reacquisition.py --seeds 12 --steps 12000 --capacity 12
