name: DYN1 active temporal bank

on:
  push:
    paths:
      - 'experiments/dyn1_active_temporal_bank.py'
      - '.github/workflows/dyn1.yml'
  workflow_dispatch:

jobs:
  dyn1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run active temporal bank gate
        run: python experiments/dyn1_active_temporal_bank.py --seeds 12 --steps 9000 --delay 30
