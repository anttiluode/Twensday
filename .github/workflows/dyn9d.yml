name: DYN9D split future-theory memory

on:
  push:
    paths:
      - 'experiments/dyn9d_split_memory.py'
      - 'experiments/dyn9_future_theory_memory.py'
      - '.github/workflows/dyn9d.yml'
  workflow_dispatch:

jobs:
  dyn9d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN9D split-memory attacker
        run: python experiments/dyn9d_split_memory.py --seeds 48 --features 16 --actions 25 --order 4 --slots 6 --capacity 6 --history-steps 150 --followup-steps 12 --contamination 0.10 --contamination-scale 6.0 --thresholds 0.75,1.5,3.0
