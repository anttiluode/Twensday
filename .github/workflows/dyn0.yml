name: DYN0 continuous machine

on:
  push:
    branches: [main]
    paths:
      - 'experiments/dyn0_hidden_dynamics_agent.py'
      - '.github/workflows/dyn0.yml'
  workflow_dispatch:

jobs:
  dyn0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run hidden-dynamics gate
        run: python experiments/dyn0_hidden_dynamics_agent.py --seeds 12 --steps 9000 --delay 30
