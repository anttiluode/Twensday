name: DYN4B cache priority attackers

on:
  push:
    paths:
      - 'experiments/dyn4_context_reacquisition.py'
      - 'experiments/dyn4b_cache_attackers.py'
      - '.github/workflows/dyn4b.yml'
  workflow_dispatch:

jobs:
  dyn4b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN4B cache priority attackers
        run: python experiments/dyn4b_cache_attackers.py --seeds 12 --steps 12000 --capacity 12
