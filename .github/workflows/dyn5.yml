name: DYN5 partial-cue reinstatement

on:
  push:
    paths:
      - 'experiments/dyn5_partial_cue_reinstatement.py'
      - '.github/workflows/dyn5.yml'
  workflow_dispatch:

jobs:
  dyn5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN5 partial-cue reinstatement gate
        run: python experiments/dyn5_partial_cue_reinstatement.py --seeds 12 --steps 12000 --capacity 24
