name: DYN5B retrieval attackers

on:
  push:
    paths:
      - 'experiments/dyn5b_retrieval_attackers.py'
      - 'experiments/dyn5_partial_cue_reinstatement.py'
      - '.github/workflows/dyn5b.yml'
  workflow_dispatch:

jobs:
  dyn5b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN5B retrieval attackers
        run: python experiments/dyn5b_retrieval_attackers.py --seeds 12 --steps 12000 --capacity 24
