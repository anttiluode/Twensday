name: DYN2 attackers

on:
  push:
    paths:
      - 'experiments/dyn2_attackers.py'
      - '.github/workflows/dyn2_attack.yml'
  workflow_dispatch:

jobs:
  attack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run DYN2 attackers
        run: python experiments/dyn2_attackers.py --seeds 12 --steps 9000 --delay 20
